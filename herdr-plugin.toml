id = "nilm987521.herdr-load-worktree"
name = "Herdr Load Worktree"
version = "0.1.0"
min_herdr_version = "0.8.0"   # 設成你本機的版本，太新會拒絕 link
platforms = ["linux", "macos"]
description = "把目前 repo 底下尚未開啟成 workspace 的 git worktree 一鍵全部開啟"

[[panes]]
id = "run"
title = "Open Worktrees"
placement = "popup"
width = "70%"
height = 20
command = ["bash", "herdr-load-worktree.sh"]

[[actions]]
id = "open-all"
title = "Open all worktrees"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open",
           "--plugin", "nilm987521.herdr-load-worktree", "--entrypoint", "run"]

# 注意：目前 herdr（測試於 0.8.2）不會把 plugin manifest 裡的 [[keys.command]]
# 合併進實際按鍵表，這段僅供參考。要讓快捷鍵生效，請照 README「安裝」章節
# 直接把同樣內容加進 ~/.config/herdr/config.toml。
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "nilm987521.herdr-load-worktree.open-all"
description = "open all worktrees"
